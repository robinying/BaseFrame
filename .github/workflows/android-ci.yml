name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.1.8937393' 'cmake;3.10.2.4988404'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug app
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon test

      - name: Run app lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
